# Bootstrap properties, resolved before server.xml is read.
#
# The values here are placeholders. Every deployment supplies the real ones through the container's
# environment - see the Dockerfile - so no credential is ever committed to this repository.

keystore.password=${env.KEYSTORE_PASSWORD}

ams.datasource.url=${env.AMS_DATASOURCE_URL}
ams.datasource.user=${env.AMS_DATASOURCE_USER}
ams.datasource.password=${env.AMS_DATASOURCE_PASSWORD}

com.ibm.ws.logging.console.format=simple
com.ibm.ws.logging.console.log.level=INFO
com.ibm.ws.logging.message.file.name=messages.log
